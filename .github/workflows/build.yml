# TONE3000 Plugin - Multi-platform build
# Builds VST3, Standalone, AU (macOS), and AAX (macOS/Windows, PACE-signed
# when secrets are configured) on macOS, Windows, and Linux. macOS is
# universal via per-arch builds + lipo, since dual -arch clang invocations are
# not sccache-cacheable.

name: Build Plugin

# Dispatch only. A signed three-platform run (notarization, PACE, Azure)
# is too expensive to fire on every PR. Restrict the `builds` environment
# to required reviewers if you want an admin gate before a runner starts.
on:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: nothing in this workflow writes back to the
# repo (artifact upload and the sccache/actions cache use the runtime token,
# not this one).
permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    environment: builds
    env:
      # Publishable key (OAuth client_id). A secret, not a variable, so it
      # is never exposed through repo variables.
      VITE_T3K_PUBLISHABLE_KEY: ${{ secrets.VITE_T3K_PUBLISHABLE_KEY }}
      # Startup update check (ui/src/t3k/config.ts). Sourced from the repo
      # variable, not hardcoded, so a clone without that variable falls
      # back to the code default of off and never pings tone3000.com.
      VITE_T3K_UPDATE_NOTICE: ${{ vars.VITE_T3K_UPDATE_NOTICE }}
      # Compiler cache (see "Setup sccache" step below); persists compiled
      # object results across runs via the GitHub Actions cache backend.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal: build arm64 + x86_64 separately (sccache-friendly),
          # then lipo into one artefact tree before packaging.
          - name: macOS Universal
            runs-on: macos-14
            os: macos
            arch: universal
          - name: Windows x64
            runs-on: windows-latest
            os: windows
            arch: x64
          - name: Linux x64
            runs-on: ubuntu-24.04
            os: linux
            arch: x64
          - name: Linux aarch64
            runs-on: ubuntu-24.04-arm
            os: linux
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Single source of truth: the repo-root VERSION file (CMake and the
      # packaging scripts read it directly; CI exports it for the steps that
      # can't).
      - name: Read version
        shell: bash
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # Compiler cache: reuses object-file compilation results from previous
      # runs (keyed on compiler input, not source paths), so unchanged JUCE /
      # NAM / plugin translation units are skipped on the next run instead of
      # being recompiled from scratch. Uses the GitHub Actions cache backend
      # (SCCACHE_GHA_ENABLED above), no manual actions/cache wiring needed.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CPM (see cmake/cpm.cmake) clones JUCE / GoogleTest / clap-juce-extensions
      # into libs/ on first configure. Caching that directory means CI skips
      # the git clone (and, for JUCE, the CMakeLists.txt source patches re-run
      # but no-op immediately since they're guarded by idempotency markers)
      # whenever the pinned versions haven't changed. Key includes matrix.os
      # since restored paths/line-endings/permissions shouldn't cross platforms.
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # CMake configure first to fetch JUCE (CPM), required before npm install
      # (UI depends on libs/juce). Use the arm64 build dir; x86_64 is configured
      # after the UI build. Single-arch (not "arm64;x86_64") so sccache can hash
      # each compile; see the lipo step below.
      - name: Configure CMake (macOS arm64 bootstrap)
        if: matrix.os == 'macos'
        run: |
          cmake -B build-arm64 -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_AAX=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache

      - name: Install WebView2 (Windows)
        if: matrix.os == 'windows'
        run: pwsh -File script/install-webview2.ps1

      # CMAKE_<LANG>_COMPILER_LAUNCHER (how sccache hooks in, see below) is only
      # honored by the Makefile/Ninja generators, not the default Visual Studio
      # (MSBuild) generator, so Windows configure steps below pass -G Ninja.
      # Ninja doesn't auto-detect the MSVC toolchain the way the VS generator
      # does, so set up the cl.exe/link.exe dev environment explicitly first.
      - name: Setup MSVC dev environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Steinberg's ASIO SDK (headers only), required for the ASIO driver
      # option in the standalone's audio settings. Not redistributable, so it
      # is fetched at build time rather than vendored in the repo.
      - name: Download ASIO SDK (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$sdk\common\iasiodrv.h")) {
            Write-Error "ASIO SDK layout unexpected: iasiodrv.h not found under $sdk"
            exit 1
          }
          $sdk = $sdk -replace '\\', '/'   # forward slashes so CMake doesn't eat backslash escapes
          "ASIO_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ASIO SDK extracted to $sdk"

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=ON \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Lint UI (Linux)
        if: matrix.os == 'linux'
        run: |
          cd ui
          npm run lint

      - name: Reconfigure CMake (macOS arm64)
        if: matrix.os == 'macos'
        run: |
          cmake -B build-arm64 -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_AAX=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache

      - name: Configure CMake (macOS x86_64)
        if: matrix.os == 'macos'
        run: |
          cmake -B build-x86_64 -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DBUILD_AAX=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache

      - name: Reconfigure CMake (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=ON \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Reconfigure CMake (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build plugin (Linux)
        if: matrix.os == 'linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Build plugin (Windows)
        if: matrix.os == 'windows'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # Sequential per-arch builds (shared runner RAM). Each arch is a distinct
      # sccache key; cold cache pays ~2× compile once, warm cache hits both.
      - name: Build plugin (macOS arm64)
        if: matrix.os == 'macos'
        run: cmake --build build-arm64 --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build plugin (macOS x86_64)
        if: matrix.os == 'macos'
        run: cmake --build build-x86_64 --config ${{ env.BUILD_TYPE }} --parallel

      # The default build already compiles DspTests (registered with ctest),
      # so running the suite costs seconds. macOS runs the native arm64 build.
      - name: Run DSP tests (Linux / Windows)
        if: matrix.os != 'macos'
        run: ctest --test-dir build/test --output-on-failure

      - name: Run DSP tests (macOS)
        if: matrix.os == 'macos'
        run: ctest --test-dir build-arm64/test --output-on-failure

      # Merge single-arch artefact trees into the path create-pkg.sh expects.
      - name: Lipo universal artefacts (macOS)
        if: matrix.os == 'macos'
        run: |
          chmod +x script/lipo-macos-artefacts.sh
          ./script/lipo-macos-artefacts.sh \
            "build-arm64/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}" \
            "build-x86_64/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}" \
            "build/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}"

      # macOS: import Developer ID certs into a temp keychain.
      # Bails out gracefully if signing secrets are not configured. In that
      # case create-pkg.sh falls back to ad-hoc signing.
      #
      # Note: APPLE_APP_PASSWORD is reused as the .p12 import password because
      # the .p12 files were exported using the same value.
      - name: Setup macOS signing keychain
        if: matrix.os == 'macos'
        env:
          MACOS_CERTIFICATE_APP: ${{ secrets.MACOS_CERTIFICATE_APP }}
          MACOS_CERTIFICATE_PKG: ${{ secrets.MACOS_CERTIFICATE_PKG }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_APP:-}" || -z "${MACOS_CERTIFICATE_PKG:-}" ]]; then
            echo "Signing secrets not configured; build will be ad-hoc signed."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain   -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE_APP" | base64 --decode -o "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" \
            -P "$APPLE_APP_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE_PKG" | base64 --decode -o "$RUNNER_TEMP/pkg.p12"
          security import "$RUNNER_TEMP/pkg.p12" \
            -P "$APPLE_APP_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/pkg.p12"

          # Let codesign / productbuild use the keys without UI prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Put our keychain at the front of the search list (keep the rest).
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | sed 's/[[:space:]"]//g')

          echo "Cert identities now visible to codesign:"
          security find-identity -v -p basic "$KEYCHAIN_PATH"

          # Save notarytool credentials in our temp keychain (only used by us).
          xcrun notarytool store-credentials "tone3000-notary" \
            --apple-id  "$APPLE_ID" \
            --team-id   "$APPLE_TEAM_ID" \
            --password  "$APPLE_APP_PASSWORD" \
            --keychain  "$KEYCHAIN_PATH"

      # AAX must carry PACE's signature or Pro Tools refuses to load it.
      # Signed via PACE Eden cloud signing: a headless iLok Cloud session
      # authorizes wraptool, which applies the PACE signature and the Apple
      # Developer ID signature in one pass (so create-pkg.sh skips re-signing
      # this bundle; see sign_bundle there). The Eden tools are not
      # redistributable and are fetched from a private URL. Bails out
      # gracefully when the PACE secrets are not configured; the AAX is then
      # ad-hoc signed like the other formats and only loads in Pro Tools
      # Developer builds.
      - name: Sign AAX with PACE (macOS)
        if: matrix.os == 'macos'
        env:
          PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
          PACE_ILOK_PASSWORD: ${{ secrets.PACE_ILOK_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_TOOLS_URL: ${{ secrets.PACE_TOOLS_URL_MAC }}
          PACE_TOOLS_TOKEN: ${{ secrets.PACE_TOOLS_TOKEN }}
          SIGN_ID_APP: ${{ secrets.SIGN_ID_APP }}
        run: |
          set -euo pipefail
          if [[ -z "${PACE_ILOK_ACCOUNT:-}" || -z "${SIGN_ID_APP:-}" ]]; then
            echo "PACE signing secrets not configured; AAX will be ad-hoc signed."
            exit 0
          fi
          chmod +x script/sign-aax-macos.sh
          ./script/sign-aax-macos.sh \
            "build/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}/AAX/TONE3000.aaxplugin"

      - name: Build .pkg installer (macOS)
        if: matrix.os == 'macos'
        env:
          SIGN_ID_APP: ${{ secrets.SIGN_ID_APP }}
          SIGN_ID_PKG: ${{ secrets.SIGN_ID_PKG }}
          NOTARY_PROFILE: tone3000-notary
        run: |
          set -euo pipefail
          ./script/create-pkg.sh

          # Tag the installer with platform + arch (matches the Windows/Linux
          # artifact naming: TONE3000-v<version>-<platform>-<arch>).
          SRC=$(ls build/TONE3000-v*.pkg | head -n 1)
          DEST="build/$(basename "${SRC%.pkg}")-macos-universal.pkg"
          mv "$SRC" "$DEST"
          echo "Renamed installer to $DEST"

      - name: Clean up macOS signing keychain
        if: matrix.os == 'macos' && always()
        env:
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-macos-universal.pkg
          if-no-files-found: error

      # Windows signing uses Azure Artifact Signing (the Windows analog of
      # Developer ID + notarization: Microsoft-managed cert, key held by the
      # service, RFC 3161 timestamp). Bails out gracefully if the Azure
      # secrets are not configured; the artifacts are then unsigned, like
      # the macOS ad-hoc fallback.
      - name: Check Windows signing config
        id: winsign
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $enabled = if ($env:AZURE_TENANT_ID) { 'true' } else { 'false' }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($enabled -eq 'false') {
            Write-Host "Signing secrets not configured; artifacts will be unsigned."
          }

      # PACE AAX signing is deliberately independent of the Authenticode
      # (Azure) gate above: the PACE signature is what Pro Tools checks, so
      # it should run as soon as the iLok secrets exist — even while Azure
      # Trusted Signing approval is still pending. When the Azure secrets are
      # also present, the sign script additionally applies Authenticode to
      # the AAX's inner DLL through the signtool shim.
      - name: Check PACE signing config
        id: pacesign
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
          PACE_TOOLS_URL_WIN: ${{ secrets.PACE_TOOLS_URL_WIN }}
        run: |
          $enabled = if ($env:PACE_ILOK_ACCOUNT -and $env:PACE_TOOLS_URL_WIN) { 'true' } else { 'false' }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($enabled -eq 'false') {
            Write-Host "PACE secrets not configured; AAX will be unsigned."
          }

      # Sign the binaries users actually run before they are packaged (the
      # .vst3 and .clap are PE DLLs, signable like any exe).
      - name: Sign binaries (Windows)
        if: matrix.os == 'windows' && steps.winsign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}
          files-folder-recurse: true
          files-folder-filter: exe,vst3,clap
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # AAX must carry PACE's signature or Pro Tools refuses to load it.
      # Signed via PACE Eden cloud signing (headless iLok Cloud session +
      # wraptool). Runs on the PACE gate, not the Azure one: the Authenticode
      # half is optional and only applied when the Azure secrets are present
      # (wraptool then delegates to signtool via the
      # script/pace/aax-signtool.bat shim). The .aaxplugin is excluded from
      # the Azure steps (extension filter) precisely so wraptool is the only
      # signer touching it.
      - name: Sign AAX with PACE (Windows)
        if: matrix.os == 'windows' && steps.pacesign.outputs.enabled == 'true'
        shell: pwsh
        env:
          PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
          PACE_ILOK_PASSWORD: ${{ secrets.PACE_ILOK_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_TOOLS_URL: ${{ secrets.PACE_TOOLS_URL_WIN }}
          PACE_TOOLS_TOKEN: ${{ secrets.PACE_TOOLS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          pwsh -File script/sign-aax-windows.ps1 `
            "$env:GITHUB_WORKSPACE\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}\AAX\TONE3000.aaxplugin"

      # Windows: build a setup.exe with Inno Setup. It ships on current
      # windows-latest images; install via choco if a future image drops it.
      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DVersion=$env:T3K_VERSION `
            /DArtefactsDir="$env:GITHUB_WORKSPACE\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}" `
            /DOutputDir="$env:GITHUB_WORKSPACE\build" `
            script\installer\windows\tone3000.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (Windows)
        if: matrix.os == 'windows' && steps.winsign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-setup.exe
          if-no-files-found: error

      # Linux: tarball with install script (the usual convention on Linux).
      - name: Package tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          PKG="TONE3000-v${T3K_VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTEFACTS="build/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}"
          STAGE="build/${PKG}"
          mkdir -p "$STAGE"
          cp -r "$ARTEFACTS/VST3/TONE3000.vst3" "$STAGE/"
          cp -r "$ARTEFACTS/LV2/TONE3000.lv2" "$STAGE/"
          cp "$ARTEFACTS/CLAP/TONE3000.clap" "$STAGE/"
          cp "$ARTEFACTS/Standalone/TONE3000" "$STAGE/"
          install -m 755 script/installer/linux/install.sh "$STAGE/install.sh"
          install -m 644 script/installer/linux/README.txt "$STAGE/README.txt"
          install -m 644 script/installer/linux/tone3000.png "$STAGE/tone3000.png"
          if compgen -G "resources/factory-presets/*.t3kpreset" > /dev/null; then
            mkdir -p "$STAGE/factory-presets"
            cp resources/factory-presets/*.t3kpreset "$STAGE/factory-presets/"
          fi
          tar -czf "build/${PKG}.tar.gz" -C build "$PKG"
          echo "Created build/${PKG}.tar.gz"

      - name: Upload artifacts (Linux)
        if: matrix.os == 'linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # iOS Simulator: configure and build the Standalone app for the iPad
  # Simulator so the iOS target cannot silently rot. No signing, no
  # installer: the unsigned Simulator .app is uploaded for QA. Xcode is the
  # generator here (the iOS presets need it for the app bundle and the
  # multi-config build), and it does not honour the sccache compiler
  # launchers, so this job builds cold.
  ios-simulator:
    name: iOS Simulator
    runs-on: macos-14
    environment: builds
    env:
      VITE_T3K_PUBLISHABLE_KEY: ${{ secrets.VITE_T3K_PUBLISHABLE_KEY }}
      VITE_T3K_UPDATE_NOTICE: ${{ vars.VITE_T3K_UPDATE_NOTICE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-ios-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # Same order as the desktop job: configure first so CPM fetches JUCE,
      # which the UI build needs, then reconfigure so the content-hashed UI
      # assets are picked up (plugin/CMakeLists.txt globs them at configure).
      - name: Configure CMake (iOS Simulator bootstrap)
        run: cmake --preset ios-simulator

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Reconfigure CMake (iOS Simulator)
        run: cmake --preset ios-simulator

      - name: Build Standalone (iOS Simulator)
        run: |
          cmake --build build-ios --config ${{ env.BUILD_TYPE }} \
            --target TONE3000_Standalone --parallel -- -sdk iphonesimulator

      - name: Package Simulator app
        run: |
          set -euo pipefail
          APP="build-ios/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}/Standalone/TONE3000.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" \
            "build-ios/TONE3000-v${T3K_VERSION}-ios-simulator.zip"

      - name: Upload artifacts (iOS Simulator)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-ios-simulator
          path: build-ios/TONE3000-v*-ios-simulator.zip
          if-no-files-found: error
