# TONE3000 Plugin - Multi-platform build
# Builds VST3, Standalone, AU (macOS) on macOS (universal arm64+x86_64), Windows, and Linux

name: Build Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    environment: builds
    env:
      VITE_T3K_PUBLISHABLE_KEY: ${{ vars.VITE_T3K_PUBLISHABLE_KEY }}
      # Compiler cache (see "Setup sccache" step below) — persists compiled
      # object results across runs via the GitHub Actions cache backend.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (arm64 + x86_64 in one binary)
          - name: macOS Universal
            runs-on: macos-14
            os: macos
            arch: universal
          - name: Windows x64
            runs-on: windows-latest
            os: windows
            arch: x64
          - name: Linux x64
            runs-on: ubuntu-24.04
            os: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Single source of truth: the repo-root VERSION file (CMake and the
      # packaging scripts read it directly; CI exports it for the steps that
      # can't).
      - name: Read version
        shell: bash
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # Compiler cache — reuses object-file compilation results from previous
      # runs (keyed on compiler input, not source paths), so unchanged JUCE /
      # NAM / plugin translation units are skipped on the next run instead of
      # being recompiled from scratch. Uses the GitHub Actions cache backend
      # (SCCACHE_GHA_ENABLED above), no manual actions/cache wiring needed.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CPM (see cmake/cpm.cmake) clones JUCE / GoogleTest / clap-juce-extensions
      # into libs/ on first configure. Caching that directory means CI skips
      # the git clone (and, for JUCE, the CMakeLists.txt source patches re-run
      # but no-op immediately since they're guarded by idempotency markers)
      # whenever the pinned versions haven't changed. Key includes matrix.os
      # since restored paths/line-endings/permissions shouldn't cross platforms.
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # CMake configure first to fetch JUCE (CPM) - required before npm install (UI depends on libs/juce)
      - name: Configure CMake (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache

      - name: Install WebView2 (Windows)
        if: matrix.os == 'windows'
        run: pwsh -File script/install-webview2.ps1

      # CMAKE_<LANG>_COMPILER_LAUNCHER (how sccache hooks in, see below) is only
      # honored by the Makefile/Ninja generators, not the default Visual Studio
      # (MSBuild) generator — so Windows configure steps below pass -G Ninja.
      # Ninja doesn't auto-detect the MSVC toolchain the way the VS generator
      # does, so set up the cl.exe/link.exe dev environment explicitly first.
      - name: Setup MSVC dev environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Steinberg's ASIO SDK (headers only) — required for the ASIO driver
      # option in the standalone's audio settings. Not redistributable, so it
      # is fetched at build time rather than vendored in the repo.
      - name: Download ASIO SDK (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$sdk\common\iasiodrv.h")) {
            Write-Error "ASIO SDK layout unexpected — iasiodrv.h not found under $sdk"
            exit 1
          }
          $sdk = $sdk -replace '\\', '/'   # forward slashes so CMake doesn't eat backslash escapes
          "ASIO_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ASIO SDK extracted to $sdk"

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=OFF \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Reconfigure CMake (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache

      - name: Reconfigure CMake (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=OFF \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Reconfigure CMake (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build plugin (Linux)
        if: matrix.os == 'linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Build plugin (macOS, Windows)
        if: matrix.os != 'linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ── macOS: import Developer ID certs into a temp keychain ───────────────
      # Bails out gracefully if signing secrets are not configured (e.g. PRs
      # from forks). In that case create-pkg.sh falls back to ad-hoc signing.
      #
      # Note: APPLE_APP_PASSWORD is reused as the .p12 import password because
      # the .p12 files were exported using the same value.
      - name: Setup macOS signing keychain
        if: matrix.os == 'macos'
        env:
          MACOS_CERTIFICATE_APP: ${{ secrets.MACOS_CERTIFICATE_APP }}
          MACOS_CERTIFICATE_PKG: ${{ secrets.MACOS_CERTIFICATE_PKG }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_APP:-}" || -z "${MACOS_CERTIFICATE_PKG:-}" ]]; then
            echo "Signing secrets not configured — build will be ad-hoc signed."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain   -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE_APP" | base64 --decode -o "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" \
            -P "$APPLE_APP_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE_PKG" | base64 --decode -o "$RUNNER_TEMP/pkg.p12"
          security import "$RUNNER_TEMP/pkg.p12" \
            -P "$APPLE_APP_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/pkg.p12"

          # Let codesign / productbuild use the keys without UI prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Put our keychain at the front of the search list (keep the rest).
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | sed 's/[[:space:]"]//g')

          echo "Cert identities now visible to codesign:"
          security find-identity -v -p basic "$KEYCHAIN_PATH"

          # Save notarytool credentials in our temp keychain (only used by us).
          xcrun notarytool store-credentials "tone3000-notary" \
            --apple-id  "$APPLE_ID" \
            --team-id   "$APPLE_TEAM_ID" \
            --password  "$APPLE_APP_PASSWORD" \
            --keychain  "$KEYCHAIN_PATH"

      - name: Build .pkg installer (macOS)
        if: matrix.os == 'macos'
        env:
          SIGN_ID_APP: ${{ secrets.SIGN_ID_APP }}
          SIGN_ID_PKG: ${{ secrets.SIGN_ID_PKG }}
          NOTARY_PROFILE: tone3000-notary
        run: |
          set -euo pipefail
          ./script/create-pkg.sh

          # Tag the installer with platform + arch (matches the Windows/Linux
          # artifact naming: TONE3000-v<version>-<platform>-<arch>).
          SRC=$(ls build/TONE3000-v*.pkg | head -n 1)
          DEST="build/$(basename "${SRC%.pkg}")-macos-universal.pkg"
          mv "$SRC" "$DEST"
          echo "Renamed installer → $DEST"

      - name: Clean up macOS signing keychain
        if: matrix.os == 'macos' && always()
        env:
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-macos-universal.pkg
          if-no-files-found: error

      # ── Windows: build a setup.exe with Inno Setup ───────────────────────────
      # Inno Setup ships on current windows-latest images; install via choco if
      # a future image drops it again.
      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DVersion=$env:T3K_VERSION `
            /DArtefactsDir="$env:GITHUB_WORKSPACE\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}" `
            /DOutputDir="$env:GITHUB_WORKSPACE\build" `
            script\installer\windows\tone3000.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-setup.exe
          if-no-files-found: error

      # ── Linux: tarball with install script (the usual convention on Linux) ──
      - name: Package tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          PKG="TONE3000-v${T3K_VERSION}-linux-x64"
          ARTEFACTS="build/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}"
          STAGE="build/${PKG}"
          mkdir -p "$STAGE"
          cp -r "$ARTEFACTS/VST3/TONE3000.vst3" "$STAGE/"
          cp -r "$ARTEFACTS/LV2/TONE3000.lv2" "$STAGE/"
          cp "$ARTEFACTS/CLAP/TONE3000.clap" "$STAGE/"
          cp "$ARTEFACTS/Standalone/TONE3000" "$STAGE/"
          install -m 755 script/installer/linux/install.sh "$STAGE/install.sh"
          install -m 644 script/installer/linux/README.txt "$STAGE/README.txt"
          tar -czf "build/${PKG}.tar.gz" -C build "$PKG"
          echo "Created build/${PKG}.tar.gz"

      - name: Upload artifacts (Linux)
        if: matrix.os == 'linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-linux-x64.tar.gz
          if-no-files-found: error
